_target_: maxyfold.data.datamodules.pdb_datamodule.PDBDataModule

# DataBackend
backend: ${storage}

# Split paths
train_set_path: ${paths.train_set_path}
val_set_path: ${paths.val_set_path}
test_set_path: ${paths.test_set_path}

# DataLoader params
batch_size: 16
num_workers: 4
pin_memory: False

# Cropper params
cropper:
  _target_: maxyfold.data.cropping.croppers.ContiguousCropper
  crop_size: 384
  # pad_token_id is 0 by default
  # ligand_prob: 0.5